<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스타팅 포켓몬 랜덤 뽑기</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="header">
    <h1>스타팅 포켓몬 랜덤 뽑기</h1>
    <p>1~9세대 스타팅 포켓몬 중 풀 · 불꽃 · 물 타입을 한 마리씩 랜덤으로 뽑습니다.</p>
    <p class="rule">포케로그 코스트 기준 · 3마리 합계 10 이하</p>
  </header>

  <main class="main">
    <div class="panel">
      <button type="button" id="draw-button" class="draw-button">뽑기!</button>
    </div>

    <section class="result">
      <p id="result-caption" class="result-caption">뽑기 버튼을 눌러 보세요.</p>
      <ul id="result-list" class="card-list"></ul>
    </section>
  </main>

  <footer class="footer">
    코스트 출처: <a href="https://github.com/pagefaultgames/pokerogue" target="_blank" rel="noopener">PokeRogue</a> ·
    이미지 출처: <a href="https://github.com/PokeAPI/sprites" target="_blank" rel="noopener">PokeAPI/sprites</a> (공식 아트워크) ·
    Pokémon © Nintendo / Creatures Inc. / GAME FREAK inc.
  </footer>

  <script src="./js/starters.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
